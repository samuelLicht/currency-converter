<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor de Monedas | Samuel Licht</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">

    <header class="header">
      <h1>💱 Conversor de Monedas</h1>
      <p>Tasas de cambio en tiempo real.</p>
    </header>

    <div class="converter">

      <div class="input-group">
        <label for="amount">Monto</label>
        <input type="number" id="amount" placeholder="0.00" min="0" />
      </div>

      <div class="selects-row">
        <div class="input-group">
          <label for="from-currency">De</label>
          <select id="from-currency"></select>
        </div>

        <button id="swap-btn" title="Intercambiar monedas">⇄</button>

        <div class="input-group">
          <label for="to-currency">A</label>
          <select id="to-currency"></select>
        </div>
      </div>

      <button id="convert-btn">Convertir</button>

    </div>

    <div id="result-card" class="result-card hidden">
      <p id="result-text"></p>
      <p id="rate-text"></p>
    </div>

    <div id="error-msg" class="error-msg hidden">
      Error al obtener las tasas. Intenta de nuevo.
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
